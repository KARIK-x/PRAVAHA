<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PRAVAHA — NEPSE Analytics Platform</title>
<meta name="theme-color" content="#06110F" />
<link rel="icon" type="image/png" sizes="64x64" href="/brand/pravaha-symbol-64.png" />
<meta http-equiv="refresh" content="2; url=/#research" />
<style>
  :root {
    --pravaha-obsidian: #06110F; --pravaha-deep-forest: #071C18; --pravaha-panel: #102722;
    --pravaha-emerald: #00D69A; --pravaha-cyan: #00D9E8; --pravaha-white: #F5F8F7;
    --pravaha-muted: #9DB4AE; --pravaha-border: #24453C;
    --font-display: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--pravaha-obsidian); color: var(--pravaha-white);
    font: 14px/1.6 var(--font-ui); padding: 24px; }
  .card { max-width: 520px; width: 100%; text-align: center; padding: 32px 28px;
    background: var(--pravaha-panel); border: 1px solid var(--pravaha-border); border-radius: 12px; }
  .mark { width: 56px; height: 56px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--pravaha-border); margin: 0 auto 16px; }
  .mark img { display: block; width: 100%; height: 100%; }
  h1 { font: 600 20px/1.2 var(--font-display); margin: 0 0 4px; letter-spacing: .02em; }
  .tag { color: var(--pravaha-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 20px; }
  p { color: var(--pravaha-muted); font-size: 13px; margin: 0 0 16px; }
  a.btn { display: inline-block; padding: 9px 16px; border-radius: 6px; font-weight: 600;
    background: var(--pravaha-emerald); color: #04150F; text-decoration: none; }
  .note { margin-top: 18px; font-size: 11.5px; color: var(--pravaha-muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="/brand/pravaha-symbol-128.png" alt="PRAVAHA" /></div>
    <h1>PRAVAHA</h1>
    <p class="tag">NEPSE Analytics Platform</p>
    <p>Opening the research desk…</p>
    <a class="btn" href="/#research">Open PRAVAHA Research Desk</a>
    <p class="note">
      The legacy static summary page has been retired. It displayed hard-coded,
      unverified figures; the unified workspace reads live stored data instead.
    </p>
  </main>
</body>
</html>
