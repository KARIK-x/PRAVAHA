# Netlify configuration — FRONTEND ONLY.
#
# The Mega Tool frontend is plain static HTML/CSS/JS with NO build step, so
# Netlify simply publishes `web/static/`.
#
# The Python/FastAPI backend and the DuckDB-backed collector CANNOT run here:
# Netlify serves static assets and short-lived serverless functions with no
# persistent process, no durable local disk, and no way to hold the gated
# environment. See docs/deployment_architecture.md. The backend therefore runs
# on an always-on host, and the frontend reaches it through the
# `<meta name="megatool-api-base">` value in web/static/index.html.
#
# NEVER add backend secrets here. Everything in this file and in web/static is
# public. The friend token is entered at runtime and kept in sessionStorage.

[build]
  publish = "web/static"

# Proxy the API to the always-on backend so a Netlify-hosted frontend works
# same-origin. Without this, the page's `fetch("/api/…")` hits Netlify itself and
# returns 404 (the empty `<meta name="megatool-api-base">` means same-origin).
# The proxy is server-side, so the browser sees one origin and CORS is not
# involved; the X-Friend-Token header is forwarded to the backend.
#
# UPDATE the host if the Render service URL changes. The token is NOT here — it
# is entered at runtime and kept in sessionStorage.
[[redirects]]
  from = "/api/*"
  to = "https://pravaha-hkwt.onrender.com/api/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
